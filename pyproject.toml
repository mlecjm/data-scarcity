[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "data_scarcity"
version = "0.2.0"
description = "Hybrid Transfer-Regularised Quantile Regression with Split-Conformal Calibration for Launch-Phase Demand Forecasting."
authors = [
    { name = "Merlec Mpyana" },
    { name = "Jean-Luc Mupasa" },
    { name = "Lucianne Kalubi" },
    { name = "Ulysse Mwanza" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tqdm>=4.65",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = ["black>=24.0", "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/mlecjm/data-scarcity"
Issues = "https://github.com/mlecjm/data-scarcity/issues"

[tool.ruff]
line-length = 99
src = ["data_scarcity", "tests"]
extend-exclude = ["scripts/make_synthetic_m5.py"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]
ignore = ["B008"]   # typer uses defaults as expressions

[tool.ruff.lint.isort]
known-first-party = ["data_scarcity"]
force-sort-within-sections = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
